contract_version: 2
name: inventory_management

sources:
  type: sqlite
  path: data/raw/inventory_management.db
  read_only: true

tables:
  materials:
    table: Materials

  purchase_order_items:
    table: PurchaseOrderItems

  purchase_order_documents:
    table: PurchaseOrderDocuments

  sales_order_items:
    table: SalesOrderItems

  sales_order_documents:
    table: SalesOrderDocuments

  goods_movements:
    table: GoodsReceiptsAndIssues

  material_stocks:
    table: MaterialStocks

objects:
  - type: MAT
    source_table: materials
    id:
      columns:
        - material_number
      
    attributes: []
  
  - type: PO_ITEM 
    source_table: purchase_order_items
    id: 
      columns: 
        - purchase_order_number
        - purchase_order_item_number
      separator: "|"
    attributes:
      - name: ordered_quantity
        source_column: quantity 
        type: integer
        mode: static

  - type: SO_ITEM
    source_table: sales_order_items

    id:
      columns:
        - sales_document_number
        - item_number
      separator: "|"

    attributes:
      - name: ordered_quantity
        source_column: quantity
        type: integer
        mode: static

  - type: MAT_PLA
    source_table: material_stocks

    id: 
      columns: 
        - material_number
        - plant
      separator: "|"

    attributes:
      - name: stock_quantity
        source_column: stock
        type: integer
        mode: dynamic

inputs:
  po_items_with_supplier:
    type: join

    base: 
      table: purchase_order_items
      alias: poi 

    joins:
      - table: purchase_order_documents
        alias: pod 
        join_type: inner 

        on: 
          - left: poi.purchase_order_number
            right: pod.purchase_order_number
    
    select: 
      purchase_order_number: poi.purchase_order_number
      purchase_order_item_number: poi.purchase_order_item_number
      supplier_id: pod.account_number_of_vendor

relationships:
  o2o: 
    - name: po_item_ordered_from_supplier
      input: po_items_with_supplier
      mode: static

      source:
        type: PO_ITEM
        id:
          columns:
            - purchase_order_number
            - purchase_order_item_number
          separator: "|"
      target:
        type: SUPPLIER 
        id: 
          columns:
            - supplier_id
        qualifier: ordered_from  
        
      