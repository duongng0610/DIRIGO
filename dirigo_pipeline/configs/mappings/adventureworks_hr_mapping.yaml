contract_version: 2
name: adventureworks_hr

sources:
  type: sqlite
  path: data/raw/adventureworks.sqlite
  read_only: true

tables:
  employees:
    table: "Employee"

  departments:
    table: "Department"

  shifts:
    table: "Shift"

  employee_pay_history:
    table: "EmployeePayHistory"

  employee_department_history:
    table: "EmployeeDepartmentHistory"

objects:
  - type: employee
    source_table: employees

    id:
      mode: option
      columns:
        - BusinessEntityID
      prefix: "EMP"

    attributes:
      static:
        - name: job_title
          source_column: JobTitle
          type: string

        - name: hire_date
          source_column: HireDate
          type: date

        - name: organization_level
          source_column: OrganizationLevel
          type: integer

        - name: salaried_flag
          source_column: SalariedFlag
          type: boolean

        - name: vacation_hours
          source_column: VacationHours
          type: integer

        - name: sick_leave_hours
          source_column: SickLeaveHours
          type: integer

        - name: current_flag
          source_column: CurrentFlag
          type: boolean

        - timestamp:
            name: timestamp
            source_column: ModifiedDate

      dynamic:
        - name: pay_rate
          source_table: employee_pay_history

          value:
            column: Rate
            type: decimal

          timestamp:
            column: RateChangeDate

          object_reference:
            key_mapping:
              BusinessEntityID: BusinessEntityID

        - name: pay_frequency
          source_table: employee_pay_history

          value:
            column: PayFrequency
            type: integer

          timestamp:
            column: RateChangeDate

          object_reference:
            key_mapping:
              BusinessEntityID: BusinessEntityID

  - type: department
    source_table: departments

    id:
      mode: option
      columns:
        - DepartmentID
      prefix: "DEPT"

    attributes:
      static:
        - name: department_name
          source_column: Name
          type: string

        - name: group_name
          source_column: GroupName
          type: string
      dynamic: []

  - type: shift
    source_table: shifts

    id:
      mode: option
      columns:
        - ShiftID
      prefix: "SHIFT"

    attributes:
      static:
        - name: shift_name
          source_column: Name
          type: string

        - name: start_time
          source_column: StartTime
          type: time

        - name: end_time
          source_column: EndTime
          type: time
      dynamic: []

events:
  - type: employee_hired
    source_table: employees

    id:
      mode: option
      columns:
        - BusinessEntityID
      prefix: "EV-HIRE"

    timestamp:
      source_column: HireDate
      name: event_time

    objects:
        - object_type: employee
          qualifier: employee_hired
  
  - type: pay_rate_set
    source_table: employee_pay_history

    id:
      mode: option
      columns:
        - BusinessEntityID
        - RateChangeDate
      prefix: "EV-PAY"

    timestamp:
      source_column: RateChangeDate
      name: event_time

    objects:
      - object_type: employee
        qualifier: assigned_employee


  - type: department_assignment_started
    source_table: employee_department_history

    id:
      mode: option
      columns:
        - BusinessEntityID
        - DepartmentID
        - ShiftID
        - StartDate
      prefix: "EV-ASSIGN-START"

    timestamp:
      source_column: StartDate
      name: event_time

    objects:
      - object_type: employee
       
        qualifier: assigned_employee

      - object_type: department
     
        qualifier: target_department

      - object_type: shift
      
        qualifier: assigned_shift

  - type: department_assignment_ended
    source_table: employee_department_history

    where:
      - column: EndDate
        condition: is_not_null

    id:
      mode: option
      columns:
        - BusinessEntityID
        - DepartmentID
        - ShiftID
        - StartDate
      prefix: "EV-ASSIGN-END"

    timestamp:
      source_column: EndDate
      name: event_time

    objects:
     - object_type: employee
       qualifier: assigned_employee

     - object_type: department
       qualifier: target_department

     - object_type: shift
       qualifier: assigned_shift

relationships:
  o2o:
    - name: employee_assigned_to_department
      mode: dynamic
      source_table: employee_department_history

      source:
        object_type: employee
        key_mapping:
          BusinessEntityID: BusinessEntityID

      target:
        object_type: department
        key_mapping:
          DepartmentID: DepartmentID

      qualifier: assigned_to

      timestamp:
        column: StartDate
        semantics: event_time

    - name: employee_unassigned_from_department
      mode: dynamic
      source_table: employee_department_history

      where:
        - column: EndDate
          condition: is_not_null

      source:
        object_type: employee

      target:
        object_type: department

      qualifier: unassigned_from

      timestamp:
        column: EndDate

    - name: employee_assigned_to_shift
      mode: dynamic
      source_table: employee_department_history

      source:
        object_type: employee

      target:
        object_type: shift

      qualifier: assigned_to_shift

      timestamp:
        column: StartDate

    - name: employee_unassigned_from_shift
      mode: dynamic
      source_table: employee_department_history

      where:
        - column: EndDate
          condition: is_not_null

      source:
        object_type: employee

      target:
        object_type: shift

      qualifier: unassigned_from_shift

      timestamp:
        column: EndDate
